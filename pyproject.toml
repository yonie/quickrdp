[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.backends._legacy:_Backend"

[project]
name = "quickrdp"
version = "0.1.0"
description = "A minimal GNOME/Linux launcher for sdl-freerdp: Enter connects"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.8"
dependencies = [
    "PyGObject>=3.42.0",
]

[project.scripts]
quickrdp = "quickrdp:main"

[tool.ruff]
target-version = "py38"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I"]

[tool.ruff.lint.per-file-ignores]
"quickrdp.py" = ["E402"]

[tool.setuptools]
py-modules = ["quickrdp"]
